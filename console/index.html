<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>QubicaAMF · hawkBit console</title>
<link rel="stylesheet" href="fonts.css">
<link rel="stylesheet" href="style.css">
<link rel="icon" href="favicon.ico" sizes="16x16 32x32 48x48">
<link rel="icon" type="image/png" href="favicon.png" sizes="64x64">
<link rel="apple-touch-icon" href="favicon.png">
<script>
  /* the chosen theme before anything is drawn: set by a module, it arrived a
     frame late and the page flashed in the default one first */
  try { var t = localStorage.getItem('hb-theme'); if (t && t !== 'auto') document.documentElement.dataset.theme = t; } catch (e) {}
</script>
</head>
<body>

<!-- login ------------------------------------------------------------ -->
<section id="login" class="hidden">
  <div class="login-glow" aria-hidden="true"></div>
  <form id="login-form">
    <div class="login-head">
      <div class="logo-tile"><img src="logo.png" alt="QubicaAMF" class="logo-big"></div>
      <h1>Update console</h1>
      <p class="sub">QubicaAMF · over-the-air updates</p>
    </div>

    <label class="f">User
      <div class="fld"><span class="fi" id="i-user"></span>
        <input type="text" id="u" autocomplete="username" value="admin"
               placeholder="admin" required></div>
    </label>
    <label class="f">Password
      <div class="fld"><span class="fi" id="i-lock"></span>
        <input type="password" id="p" autocomplete="current-password"
               placeholder="••••••••" required>
        <button type="button" class="reveal" id="reveal" title="show password"
                aria-label="show password"></button></div>
    </label>

    <button class="btn primary lg" id="signin" type="submit">Sign in</button>
    <p id="login-err" class="hidden banner-err"></p>

    <div class="login-foot">
      <p>Credentials stay in this tab and go straight to the update server.</p>
    </div>
  </form>
</section>

<!-- app -------------------------------------------------------------- -->
<div id="app" class="hidden">
  <aside id="sidebar">
    <div class="brand">
      <img src="logo.png" alt="QubicaAMF" class="logo">
      <div class="brand-t"><b id="srv-name">hawkBit</b><span id="srv-ver">console</span></div>
      <button class="btn sm ghost" id="navtoggle" title="collapse"></button>
    </div>
    <nav id="nav"></nav>
    <div class="side-foot">
      <div class="row"><span id="conn">—</span><span id="busy"></span></div>
      <div class="row">
        <label class="flex" style="gap:6px" title="colour theme">
          <span class="lbl">theme</span>
          <select id="theme"></select>
        </label>
      </div>
      <div class="row">
        <span class="faint" title="every value on every page follows the server by itself">live</span>
        <button class="btn sm" id="logout">exit</button>
      </div>
    </div>
  </aside>

  <main id="main">
    <header class="bar">
      <h1 id="title">Dashboard</h1>
      <div class="grow"></div>
      <div id="bar-extra" class="flex"></div>
    </header>
    <div id="progress"></div>
    <div id="view"></div>
  </main>
</div>

<div id="scrim"></div>
<aside id="drawer">
  <div class="dhead">
    <h2 id="drawer-title"></h2>
    <div class="grow" style="flex:1"></div>
    <button class="btn sm" id="drawer-close">close</button>
  </div>
  <div class="dbody" id="drawer-body"></div>
</aside>

<div class="toast-wrap" id="toasts"></div>

<dialog id="modal">
  <h3 id="modal-title"></h3>
  <div class="dc" id="modal-body"></div>
  <div class="da">
    <button class="btn" id="modal-cancel">Cancel</button>
    <button class="btn primary" id="modal-ok">OK</button>
  </div>
</dialog>

<script>
  /* Which of the two screens to show is decided here, during parsing, and not
     in the module tree: modules are deferred, so they run after the page has
     painted -- which showed the sign-in card for a frame on every refresh of
     an already signed-in session. Both start hidden, so a wrong one is never
     shown; the worst case is a blank frame. */
  try {
    var signedIn = !!sessionStorage.getItem('hb-auth');
    document.getElementById(signedIn ? 'app' : 'login').classList.remove('hidden');
  } catch (e) {
    document.getElementById('login').classList.remove('hidden');
  }
</script>
<script type="module" src="js/main.js"></script>
</body>
</html>
